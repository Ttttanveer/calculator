<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>C Calculator</title>

    <link rel="stylesheet"
          href="style.css">

</head>

<body>

    <main class="calculator">

        <div class="display">

            <div id="expression"></div>

            <div id="result">0</div>

        </div>


        <div class="buttons">

            <button class="function"
                    onclick="clearCalculator()">
                C
            </button>

            <button class="function"
                    onclick="backspace()">
                ⌫
            </button>

            <button class="function"
                    onclick="addOperator('%')">
                %
            </button>

            <button class="operator"
                    onclick="addOperator('/')">
                ÷
            </button>


            <button onclick="addNumber('7')">
                7
            </button>

            <button onclick="addNumber('8')">
                8
            </button>

            <button onclick="addNumber('9')">
                9
            </button>

            <button class="operator"
                    onclick="addOperator('*')">
                ×
            </button>


            <button onclick="addNumber('4')">
                4
            </button>

            <button onclick="addNumber('5')">
                5
            </button>

            <button onclick="addNumber('6')">
                6
            </button>

            <button class="operator"
                    onclick="addOperator('-')">
                −
            </button>


            <button onclick="addNumber('1')">
                1
            </button>

            <button onclick="addNumber('2')">
                2
            </button>

            <button onclick="addNumber('3')">
                3
            </button>

            <button class="operator"
                    onclick="addOperator('+')">
                +
            </button>


            <button class="zero"
                    onclick="addNumber('0')">
                0
            </button>

            <button onclick="addNumber('.')">
                .
            </button>

            <button class="equals"
                    onclick="calculate()">
                =
            </button>

        </div>

    </main>

    <script src="script.js"></script>

</body>

</html>
